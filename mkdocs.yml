site_name: AI Observability with Dynatrace
site_description: Learn how to observe AI applications using OpenTelemetry and Dynatrace
site_author: Dynatrace
docs_dir: docs
theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/dynatrace-logo.png
  favicon: assets/dynatrace-logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  font:
    text: Inter
    code: JetBrains Mono

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/external-links.js
  - javascripts/badges.js
  - javascripts/rum-bizevents.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: index.md
  - Prerequisites: foundation/prerequisites.md
  - Setup: foundation/setup.md
  - Foundation:
    - foundation/index.md
    - Tokens: foundation/tokens.md
    - What's in a Request: foundation/anatomy-of-a-request.md
    - OpenTelemetry: foundation/opentelemetry.md
    - AWS Bedrock: foundation/aws-bedrock.md
    - Setup: foundation/setup.md
  - Monitor Production AI:
    - monitor-production/index.md
    - "Step 1: Your First AI Call": monitor-production/01-single-call.md
    - "Step 2: Adding Observability": monitor-production/02-add-observability.md
    - "Step 3: Guardrails": monitor-production/03-guardrails.md
    - "Step 4: Agentic Pipeline": monitor-production/04-agentic-pipeline.md
    - "Step 5: Agentic Loop": monitor-production/05-agentic-loop.md
    - "Step 6: Streaming": monitor-production/06-streaming.md
    - "Step 7: RAG": monitor-production/07-rag.md
    - "Step 8: Model Migration": monitor-production/08-model-selection.md
  - Monitor AI in Development:
    - monitor-development/index.md
  - Badges: badges.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/dynatrace
    - icon: fontawesome/solid/globe
      link: https://dynatrace.com
